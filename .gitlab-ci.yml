# Builds the MSI on a version tag and publishes it to this project's Generic
# Package Registry, which gives a stable, versioned, unauthenticated-download
# HTTPS URL - exactly what the Microsoft Store's "unpackaged app" submission
# wants for its Package URL field (it downloads straight from that URL, no
# file upload to Partner Center). No updater in the app, so a new version
# just means a new tag -> a new URL to paste into Partner Center.
#
# The release (GitLab Releases API) is created with a plain curl POST rather
# than the `release:` keyword - that keyword hands off to release-cli's
# bundled `glab`, which was seen "stat"-ing our asset URL like a local file
# path and failing with ENOENT ("no such file or directory") even though the
# upload right before it had already gotten back 201 Created. Doing it
# ourselves, in the same job as the upload, also sidesteps any timing gap
# between the upload becoming visible and a separate job checking for it.
#
# Runs on a self-hosted Windows runner using the `shell` executor, so it
# reuses whatever's already installed on that machine (Rust, Node, pnpm)
# instead of reinstalling a toolchain on every run. Register the runner with
# a tag matching the one below (or edit the tag to match what you used):
#
#   gitlab-runner register --executor shell --tag-list windows
#
# Register/run the service under your own Windows user account, not the
# default LocalSystem account - LocalSystem won't see rustup/pnpm on PATH
# even though your interactive shell does.

stages:
  - build

variables:
  PACKAGE_NAME: transfert

build-msi:
  stage: build
  tags:
    - windows # must match the tag your self-hosted runner registered with
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual # smoke-test the pipeline without cutting a tag
  # GitLab Runner git-cleans the checkout before every job (wipes
  # node_modules/ and target/ along with everything else untracked), so
  # without this every tag push means a full ~6min Rust rebuild from
  # scratch. Cache is stored locally on this runner (self-hosted, not a
  # SaaS one) so restoring it is just a local copy, not a network upload.
  cache:
    key:
      files:
        - pnpm-lock.yaml
        - src-tauri/Cargo.lock
    paths:
      - node_modules/
      - src-tauri/target/
  script:
    - pnpm install --frozen-lockfile
    - pnpm tauri build --bundles msi
    - $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter *.msi | Select-Object -First 1
    - Write-Host "Built $($msi.Name)"
    - |
      # Only tag pipelines publish anything - manual test runs (see `rules:`
      # above) just keep the .msi artifact, no package/release created.
      if ($env:CI_COMMIT_TAG) {
        $url = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/$env:PACKAGE_NAME/$env:CI_COMMIT_TAG/$($msi.Name)"
        curl.exe --fail -sS -w "`nHTTP status: %{http_code}`n" --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file $msi.FullName $url
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Upload to the package registry failed (curl exit $LASTEXITCODE) - see the response above."
          exit 1
        }

        $description = "Standalone Windows installer (MSI).`n`nThis is also the Microsoft Store `"Package URL`" for this version:`n$url"
        $releaseBody = @{
          tag_name    = $env:CI_COMMIT_TAG
          name        = "Transfert $env:CI_COMMIT_TAG"
          description = $description
          assets      = @{ links = @(@{ name = $msi.Name; url = $url }) }
        } | ConvertTo-Json -Depth 5
        $releaseBody | Out-File -FilePath release.json -Encoding utf8NoBOM

        $releaseUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/releases"
        curl.exe --fail -sS -w "`nHTTP status: %{http_code}`n" --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --header "Content-Type: application/json" --data "@release.json" $releaseUrl
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Release creation failed (curl exit $LASTEXITCODE) - see the response above."
          exit 1
        }
      }
  artifacts:
    paths:
      - src-tauri/target/release/bundle/msi/*.msi
    expire_in: 1 week
