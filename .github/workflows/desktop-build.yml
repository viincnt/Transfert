name: Build desktop app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/desktop-build.yml"
      - "apps/desktop/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/prepare-vlc.mjs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/desktop-build.yml"
      - "apps/desktop/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/prepare-vlc.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            bundle: dmg,app
            artifact-name: transfert-macos
            artifact-path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            bundle: msi
            artifact-name: transfert-windows
            artifact-path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm --filter desktop test

      - name: Test Rust converters
        run: pnpm --filter desktop test:rust

      - name: Install LibVLC (Windows)
        if: runner.os == 'Windows'
        run: choco install vlc --yes --no-progress

      - name: Install LibVLC (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask vlc

      - name: Stage portable LibVLC runtime
        run: pnpm --filter desktop prepare:vlc

      - name: Test staged codecs (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $env:TRANSFERT_VLC_DIR = "$pwd/apps/desktop/src-tauri/resources/vlc"
          pnpm --filter desktop test:media

      - name: Track LibVLC audio sample-loss regression (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $env:TRANSFERT_VLC_DIR = "$pwd/apps/desktop/src-tauri/resources/vlc"
          pnpm --filter desktop test:media:regression

      - name: Test staged codecs (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: DYLD_LIBRARY_PATH="$PWD/apps/desktop/src-tauri/resources/vlc/lib" TRANSFERT_VLC_DIR="$PWD/apps/desktop/src-tauri/resources/vlc/lib" pnpm --filter desktop test:media

      - name: Track LibVLC audio sample-loss regression (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: DYLD_LIBRARY_PATH="$PWD/apps/desktop/src-tauri/resources/vlc/lib" TRANSFERT_VLC_DIR="$PWD/apps/desktop/src-tauri/resources/vlc/lib" pnpm --filter desktop test:media:regression

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          node -e "const version = require('./apps/desktop/package.json').version;
           const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
           if (version !== tag) throw new Error('Tag ' + tag + ' does not match app version ' + version);"

      - name: Prepare updater signing key
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            {
              echo 'TAURI_SIGNING_PRIVATE_KEY<<EOF'
              echo '${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}'
              echo EOF
            } >> "$GITHUB_ENV"
          else
            pnpm --filter desktop tauri signer generate --ci --write-keys "$RUNNER_TEMP/transfert.key"
            echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/transfert.key" >> "$GITHUB_ENV"
          fi

      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm --filter desktop tauri build --config src-tauri/tauri.vlc.conf.json --bundles ${{ matrix.bundle }}

      - name: Upload installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

      - name: Build and publish signed release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --config src-tauri/tauri.vlc.conf.json --bundles ${{ matrix.bundle }}
          tagName: ${{ github.ref_name }}
          releaseName: Transfert v__VERSION__
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
